<!-- ==========================================================================
     HUNAIX ENTERPRISE PLATFORM - FEATURE-BASED ARCHITECTURE
     Clean Layout (Header / Footer) & Independent Feature Components
     ========================================================================== -->

<div class="hunaix-wrapper min-h-screen transition-colors duration-300 relative overflow-hidden"
  [class.dark]="themeService.isDark()" [attr.dir]="translationService.direction()">

  <!-- 1. Header Layout -->
  <app-header />

  <!-- 2. Main Feature Flow -->
  <main>
    <!-- Hero Section -->
    <app-hero />

    <!-- About & Vision Section -->
    <app-about />

    <!-- Services Carousel Slider -->
    <app-services />

    <!-- Methodology & Workflow Section -->
    <app-methodology />

    <!-- Digital Solutions SaaS Suite -->
    <app-solutions />

    <!-- ROI & Cost Savings Calculator -->
    <app-calculator />

    <!-- Testimonials & Client Reviews -->

    <!-- Call to Action Banner -->
    <!-- <app-cta-banner /> -->

    <!-- Frequently Asked Questions -->
    <app-faqs />
  </main>

  <!-- 3. Footer Layout -->
  <app-footer />

  <!-- Floating Scroll To Top Button -->
  @if (showScrollTop()) {
  <button (click)="scrollToTop()"
    class="fixed bottom-6 right-6 rtl:right-auto rtl:left-6 z-40 w-11 h-11 sm:w-12 sm:h-12 rounded-full bg-[var(--color-primary)] text-white shadow-2xl shadow-blue-600/50 flex items-center justify-center transform hover:scale-110 active:scale-95 transition-all cursor-pointer">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 15l7-7 7 7" />
    </svg>
  </button>
  }

</div>
