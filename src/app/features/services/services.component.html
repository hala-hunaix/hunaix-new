<!-- ==================== 4. OUR SERVICES SECTION (SMOOTH SLIDER) ==================== -->
<section id="services" class="py-20 sm:py-24 relative overflow-hidden bg-[var(--bg-page)]"
  (mouseenter)="onServiceCarouselMouseEnter()" (mouseleave)="onServiceCarouselMouseLeave()">
  <!-- Subtle Dot Pattern Graphic -->
  <div class="absolute inset-0 bg-dot-pattern opacity-20 pointer-events-none"></div>

  <div
    class="max-w-7xl mx-auto px-4 sm:px-6 relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-10 lg:gap-12 items-center">

    <!-- Left Side: Interactive Smooth Carousel Viewport -->
    <div class="lg:col-span-9 overflow-hidden order-2 lg:order-1 relative">
      <!-- Sliding Track -->
      <div class="flex transition-transform duration-500 ease-out" [style.transform]="serviceSliderTransform()">
        @for (s of contentService.services; track s.id; let idx = $index) {
        <div class="w-full md:w-1/2 lg:w-1/3 flex-shrink-0 px-3">
          <div
            class="bg-[var(--bg-card)] rounded-3xl p-6 sm:p-7 border border-[var(--border-color-card)] shadow-[0_15px_35px_-10px_rgba(0,0,0,0.05)] hover:shadow-[0_25px_50px_-12px_rgba(15,79,205,0.12)] transition-all duration-300 transform hover:-translate-y-1.5 flex flex-col justify-between h-full min-h-[400px] group">
            <div>
              <!-- Tag Badge -->
              <div
                class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-[var(--color-primary-subtle)] text-[var(--color-primary)] text-[11px] font-black uppercase mb-4">
                <span class="w-1.5 h-1.5 rounded-full bg-[var(--color-primary)]"></span>
                {{ localize(s.tag) }}
              </div>

              <!-- Card Thumbnail -->
              <div class="w-full h-40 rounded-2xl overflow-hidden mb-5 bg-slate-100 dark:bg-slate-800">
                <img [src]="s.image" [alt]="localize(s.title)"
                  class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
              </div>
              <h3 class="font-black text-base sm:text-lg text-[var(--text-primary)] mb-2.5 line-clamp-1">
                {{ localize(s.title) }}
              </h3>
              <p class="text-xs text-[var(--text-secondary)] leading-[1.8] line-clamp-3 mb-5 font-medium">
                {{ localize(s.description) }}
              </p>
            </div>

            <a href="#contact"
              class="inline-flex items-center gap-2 text-xs font-black uppercase tracking-wider text-[var(--color-primary)] hover:text-[var(--color-primary-light)] transition-colors pt-3 border-t border-[var(--border-color-light)]">
              <span>{{ t('services.readMore') }}</span>
              <svg class="w-4 h-4 transform" [class.rotate-180]="translationService.isArabic()" fill="none"
                viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
              </svg>
            </a>
          </div>
        </div>
        }
      </div>

      <!-- Slider Pagination Dots Indicator -->
      <div class="flex items-center justify-center gap-2 pt-8">
        @for (step of [].constructor(maxServiceSteps()); track $index; let i = $index) {
        <button (click)="setServiceIndex(i)" [class.w-8]="i === activeServiceIndex()"
          [class.bg-[var(--color-primary)]]="i === activeServiceIndex()" [class.w-2.5]="i !== activeServiceIndex()"
          [class.bg-[var(--border-color)]]="i !== activeServiceIndex()"
          class="h-2.5 rounded-full transition-all duration-300 cursor-pointer"
          [attr.aria-label]="'Go to slide ' + (i + 1)">
        </button>
        }
      </div>
    </div>

    <!-- Right Side: Soft Rounded Diamond "Our Services" Badge & Slider Arrows -->
    <div class="lg:col-span-3 flex flex-col items-center justify-center gap-6 sm:gap-8 order-1 lg:order-2"
      [class.lg:items-center]="translationService.isArabic()">
      <!-- Rounded Diamond Badge with gentle curvature -->
      <div
        class="w-44 h-44 sm:w-52 sm:h-52 rounded-[36px] bg-[var(--bg-card)] border-2 border-[var(--border-color)] shadow-xl shadow-blue-500/10 transform rotate-45 flex items-center justify-center relative group hover:border-[var(--color-primary)] transition-all">
        <div class="transform -rotate-45 text-center flex flex-col items-center gap-2.5">
          <!-- 9-dot grid icon -->
          <div class="grid grid-cols-3 gap-1.5 w-8 h-8 sm:w-9 sm:h-9 text-[var(--color-primary)]">
            <span class="w-2 h-2 rounded-full bg-[var(--color-primary)]"></span>
            <span class="w-2 h-2 rounded-full bg-[var(--color-primary)]"></span>
            <span class="w-2 h-2 rounded-full bg-[var(--color-primary)]"></span>
            <span class="w-2 h-2 rounded-full bg-[var(--color-primary)]"></span>
            <span class="w-2 h-2 rounded-full bg-[var(--color-primary)]"></span>
            <span class="w-2 h-2 rounded-full bg-[var(--color-primary)]"></span>
            <span class="w-2 h-2 rounded-full bg-[var(--color-primary)]"></span>
            <span class="w-2 h-2 rounded-full bg-[var(--color-primary)]"></span>
            <span class="w-2 h-2 rounded-full bg-[var(--color-primary)]"></span>
          </div>
          <div class="font-black text-lg sm:text-xl text-[var(--text-primary)] tracking-tight">
            {{ t('services.badge') }}
          </div>
        </div>
      </div>

      <!-- Slider Arrows (< >) -->
      <div class="flex items-center gap-3 pt-2">
        <button (click)="prevService()"
          class="w-11 h-11 rounded-full border border-[var(--border-color)] bg-[var(--bg-card)] text-[var(--text-secondary)] hover:text-[var(--color-primary)] hover:border-[var(--color-primary)] flex items-center justify-center transition-all shadow-sm cursor-pointer"
          title="Previous Service">
          <svg class="w-4 h-4 transform" [class.rotate-180]="translationService.isArabic()" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <button (click)="nextService()"
          class="w-11 h-11 rounded-full border border-[var(--border-color)] bg-[var(--bg-card)] text-[var(--text-secondary)] hover:text-[var(--color-primary)] hover:border-[var(--color-primary)] flex items-center justify-center transition-all shadow-sm cursor-pointer"
          title="Next Service">
          <svg class="w-4 h-4 transform" [class.rotate-180]="translationService.isArabic()" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </div>

  </div>
</section>
