<!-- ==================== 2. HERO SECTION ==================== -->
<section class="relative pt-4 pb-16 md:pt-10 md:pb-24 overflow-hidden">
  <!-- Fluid Curved Top-Corner Mask (Desktop only) -->
  <div class="hero-diagonal-shape hidden lg:block" [class.hero-diagonal-shape-rtl]="translationService.isArabic()">
  </div>

  <div
    class="max-w-7xl mx-auto px-4 sm:px-6 relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">

    <!-- Left Column: Headline & CTA (Full width on mobile/tablet, 7-cols on desktop) -->
    <div [class.lg:col-span-7]="isDesktop()" [class.col-span-12]="!isDesktop()"
      class="space-y-5 text-center lg:text-left" [class.lg:text-right]="translationService.isArabic()">
      <div
        class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[var(--color-primary-subtle)] text-[var(--color-primary)] text-xs font-bold uppercase tracking-wider">
        <span class="w-2 h-2 rounded-full bg-[var(--color-primary)] animate-pulse"></span>
        {{ t('hero.badge') }}
      </div>

      <h1
        class="text-3xl sm:text-4xl lg:text-6xl font-extrabold tracking-tight text-[var(--text-primary)] leading-[1.2]">
        {{ t('hero.titleLine1') }} <br class="hidden sm:inline" />
        <span
          class="text-transparent bg-clip-text bg-gradient-to-r from-[var(--color-primary)] via-[#156FFF] to-[#38BDF8]">
          {{ t('hero.titleLine2') }}
        </span>
      </h1>

      <p class="text-sm sm:text-base lg:text-lg text-[var(--text-secondary)] max-w-xl mx-auto lg:mx-0 leading-relaxed">
        {{ t('hero.description') }}
      </p>

      <div class="pt-3 flex flex-wrap items-center justify-center lg:justify-start gap-4">
        <!-- Main Button "START YOUR JOURNEY >" -->
        <a href="#contact"
          class="inline-flex items-center gap-3 px-6 sm:px-7 py-3 sm:py-3.5 rounded-full font-bold text-xs sm:text-sm uppercase tracking-wider text-[var(--color-primary)] bg-[var(--bg-card)] border-2 border-[var(--color-primary)] hover:bg-[var(--color-primary)] hover:text-white shadow-lg shadow-blue-500/10 transition-all transform hover:-translate-y-0.5">
          <span>{{ t('hero.btnInvite') }}</span>
          <svg class="w-4 h-4 transform" [class.rotate-180]="translationService.isArabic()" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
          </svg>
        </a>

        <a href="#services"
          class="inline-flex items-center gap-2 px-5 py-3 rounded-full font-semibold text-xs sm:text-sm text-[var(--text-secondary)] hover:text-[var(--color-primary)] transition-colors">
          <span>{{ t('hero.btnExplore') }}</span>
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </a>
      </div>
    </div>

    <!-- Right Column: 3D Spatial Interactive Logo Card (Desktop Only: conditionally rendered to avoid mobile GPU/CPU overhead) -->
    @if (isDesktop()) {
    <div class="hidden lg:flex lg:col-span-5 justify-center items-center relative">
      <div class="w-full max-w-[460px] aspect-square relative flex items-center justify-center">
        @defer {
        <app-hero-3d-logo ngSkipHydration />
        } @placeholder {
        <div class="w-full h-full min-h-[420px] flex items-center justify-center">
          <div class="w-10 h-10 rounded-full border-4 border-blue-500/20 border-t-blue-500 animate-spin"></div>
        </div>
        }
      </div>
    </div>
    }

  </div>
</section>
